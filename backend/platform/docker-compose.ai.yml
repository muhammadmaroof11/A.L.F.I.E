services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4" ]
    environment:
      # Secrets should be passed from the environment or .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-fallback}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-sk-fallback}
      # LiteLLM master key for our services to auth against
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - REDIS_URL=redis://redis:6379/0
    networks:
      - alfie_network
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`llm.alfie.localhost`)"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"

networks:
  alfie_network:
    external: true

services:
  llmlingua:
    build:
      context: ..
      dockerfile: Dockerfile.llmlingua
    ports:
      - "5000:5000"
    networks:
      - alfie_network