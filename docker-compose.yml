services:
  alfie-agent:
    build: .
    restart: unless-stopped
    depends_on:
      - alfie-mongodb
      - postgres
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://alfie-mongodb:27017
      - MONGODB_DB_NAME=alfie_ai

  alfie-mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=alfie_secure_postgres_pass
      - POSTGRES_DB=twenty_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  alfie-worker:
    build: .
    command: arq worker.WorkerSettings
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    env_file:
      - .env

volumes:
  mongodb_data:
  postgres_data:
  redis_data:
