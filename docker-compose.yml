services:
  alfie-agent:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - alfie-mongodb
      - postgres
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://alfie-mongodb:27017
      - MONGODB_DB_NAME=alfie_ai

  alfie-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - ./backend/.env

  alfie-mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=alfie_secure_postgres_pass
      - POSTGRES_DB=twenty_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--maxmemory 512mb --maxmemory-policy allkeys-lru

  alfie-worker:
    build: ./backend
    command: arq worker.WorkerSettings
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    env_file:
      - ./backend/.env

volumes:
  mongodb_data:
  postgres_data:
  redis_data:
