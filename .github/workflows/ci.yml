name: A.L.F.I.E CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=120 --extend-ignore=E501 --statistics

    - name: Check formatting with black
      run: |
        black --check backend/

  docker-build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build API Image
      run: docker build -t alfie-api -f backend/Dockerfile.api backend/
      
    - name: Build Agent Image
      run: docker build -t alfie-agent -f backend/Dockerfile backend/

  frontend-build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Build Super Admin UI
      run: |
        cd super_admin_ui
        npm ci
        npm run build

    - name: Build Client Admin UI
      run: |
        cd client_admin_ui
        npm ci
        npm run build

    - name: Build Marketing Website
      run: |
        cd alfie_website
        npm ci
        npm run build
