name: A.L.F.I.E CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --extend-ignore=E501 --statistics

    - name: Check formatting with black
      run: |
        black --check .

  docker-build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build API Image
      run: docker build -t alfie-api -f Dockerfile.api .
      
    - name: Build Agent Image
      run: docker build -t alfie-agent -f Dockerfile .
      
    - name: Build Super Admin UI
      run: |
        cd super_admin_ui
        npm install
        docker build -t super-admin-ui -f Dockerfile .
        
    - name: Build Client Admin UI
      run: |
        cd client_admin_ui
        npm install
        docker build -t client-admin-ui -f Dockerfile .
